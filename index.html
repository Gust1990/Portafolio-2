<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Icono - SaaS Portfolio</title>
    <style>
        body {
            background-color: #111111;
            color: #f3f4f6;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .preview-container {
            /* Simulamos el recorte de iOS para la previsualización */
            width: 256px;
            height: 256px;
            border-radius: 56px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn {
            background-color: #06b6d4;
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn:hover {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }
        p { color: #8b8d91; text-align: center; max-width: 400px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="preview-container">
        <!-- El canvas real es de 1024x1024, pero se escala para la vista previa -->
        <canvas id="iconCanvas" width="1024" height="1024"></canvas>
    </div>

    <button class="btn" onclick="descargarIcono()">Descargar PNG (1024x1024)</button>
    <p>El PNG generado es un cuadrado completo sin esquinas redondeadas. iOS y Android (Adaptive Icons) se encargarán de aplicar sus propias máscaras de recorte automáticamente.</p>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;
        const cx = size / 2;
        const cy = size / 2 + 120; // Centro desplazado hacia abajo

        function drawIcon() {
            // 1. Fondo Oscuro (Gradiente radial)
            const bgGradient = ctx.createRadialGradient(cx, cy - 100, 100, cx, cy, size);
            bgGradient.addColorStop(0, '#1a1a24');
            bgGradient.addColorStop(1, '#050505');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, size, size);

            // 2. Cuadrícula de fondo sutil (Estilo Terminal)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 2;
            for(let i = 0; i < size; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
            }

            // 3. Gráfica de Tendencia Alcista (Fondo del medidor)
            ctx.beginPath();
            ctx.moveTo(cx - 300, cy - 50);
            ctx.lineTo(cx - 150, cy - 200);
            ctx.lineTo(cx - 20, cy - 120);
            ctx.lineTo(cx + 250, cy - 400);
            
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 24;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 30;
            ctx.stroke();

            // Punta de flecha de la gráfica
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.moveTo(cx + 250, cy - 400);
            ctx.lineTo(cx + 180, cy - 400);
            ctx.lineTo(cx + 250, cy - 330);
            ctx.fill();

            // Restaurar sombras
            ctx.shadowBlur = 0;

            // 4. Medidor (Arco)
            const radius = 380;
            
            // Arco de fondo (Track)
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 0);
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 60;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Arco de rendimiento (Gradiente Rojo -> Amarillo -> Verde)
            const arcGradient = ctx.createLinearGradient(cx - radius, cy, cx + radius, cy);
            arcGradient.addColorStop(0, '#ef4444');
            arcGradient.addColorStop(0.5, '#f59e0b');
            arcGradient.addColorStop(1, '#10b981');

            ctx.beginPath();
            // Arco hasta el 85% de rendimiento (alcista)
            const endAngle = Math.PI + (Math.PI * 0.85); 
            ctx.arc(cx, cy, radius, Math.PI, endAngle);
            ctx.strokeStyle = arcGradient;
            ctx.lineWidth = 60;
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 40;
            ctx.stroke();

            // Restaurar sombras
            ctx.shadowBlur = 0;

            // 5. Aguja del Medidor
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(endAngle); // Apuntar al 85%

            // Sombra de la aguja
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;

            // Cuerpo de la aguja
            ctx.fillStyle = '#f3f4f6';
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(0, - radius + 40); // Largo de la aguja
            ctx.lineTo(20, 0);
            ctx.arc(0, 0, 45, 0, Math.PI, false);
            ctx.fill();

            // Eje central (Punto cyan)
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function descargarIcono() {
            const link = document.createElement('a');
            link.download = 'app-icon-1024.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Generar al cargar
        drawIcon();
    </script>
</body>
</html>
