<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Portfolio Tracker (USD)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #050505;
            --bg-panel: #111111;
            --border-color: #222222;
            --text-main: #f3f4f6;
            --text-muted: #8b8d91;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --glow-cyan: rgba(6, 182, 212, 0.3);
            --glow-green: rgba(16, 185, 129, 0.4);
            --glow-red: rgba(239, 68, 68, 0.4);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a24 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo para el nuevo logo Canvas */
        #appLogo {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            border-radius: 14px;
            box-shadow: 0 0 15px var(--glow-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        h2 { font-weight: 700; margin-bottom: 5px; font-size: 28px; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 14px; margin: 0; }
        
        .panel {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            width: 90vw;
            max-width: 1000px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .control-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="text"], input[type="date"] {
            background-color: #0a0a0a;
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-weight: 600;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
            font-family: monospace;
        }
        
        input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15); }
        
        input[readonly] {
            background-color: #1a1a1a;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .btn {
            background-color: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            margin-top: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover { box-shadow: 0 0 15px var(--glow-cyan); transform: translateY(-1px); }
        
        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-top: 0;
            font-weight: 600;
        }
        .btn-outline:hover { background-color: #1a1a1a; border-color: #333; transform: none; box-shadow: none; }
        
        .btn-danger { color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); border-color: var(--accent-red); }

        .status-box {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            margin-top: 10px;
            background-color: #0a0a0a;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .status-good { color: var(--accent-green); border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 15px rgba(16,185,129,0.05); }
        .status-bad { color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 15px rgba(239,68,68,0.05); }

        .chart-container {
            position: relative;
            height: 60vh;
            width: 90vw;
            max-width: 1000px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }
        
        .file-input-wrapper { display: inline-block; position: relative; overflow: hidden; }
        .file-input-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }

        /* Estilos del Modal Alerta (Dinámico) */
        .mega-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .mega-alert-box {
            border: 2px solid;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            color: #fff;
            max-width: 550px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mega-alert-box.positive {
            background: linear-gradient(135deg, #065f46, #047857);
            border-color: var(--accent-green);
            box-shadow: 0 0 50px var(--glow-green);
        }
        .mega-alert-box.positive h3 { color: #34d399; }
        .mega-alert-box.positive p { color: #ecfdf5; }
        .mega-alert-box.positive .btn-mega { color: #064e3b; }

        .mega-alert-box.negative {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            border-color: var(--accent-red);
            box-shadow: 0 0 50px var(--glow-red);
        }
        .mega-alert-box.negative h3 { color: #fca5a5; }
        .mega-alert-box.negative p { color: #fef2f2; }
        .mega-alert-box.negative .btn-mega { color: #7f1d1d; }
        
        .mega-alert-box h3 { font-size: 30px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .mega-alert-box p { font-size: 18px; line-height: 1.5; margin-bottom: 30px;}
        .mega-alert-box strong { font-size: 28px; color: #fff; display: block; margin-top: 10px; }
        
        .btn-mega {
            background-color: #fff; 
            font-size: 16px; padding: 12px 30px; margin-top: 0;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn-mega:hover { box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        @keyframes popIn { 
            0% { transform: scale(0.7); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <!-- Modal de Alerta Dinámica -->
    <div id="megaAlert" class="mega-alert-overlay">
        <div id="megaAlertBox" class="mega-alert-box positive">
            <h3 id="megaAlertTitle">🚀 ¡Rendimiento Extraordinario! 🚀</h3>
            <p id="megaAlertDesc"></p>
            <button class="btn btn-mega" onclick="cerrarAlerta()">Entendido</button>
        </div>
    </div>

    <div class="header">
        <!-- Reemplazamos el SVG con el Canvas para el logo -->
        <canvas id="appLogo" width="1024" height="1024"></canvas>
        <h2>Rendimientos a largo plazo</h2>
    </div>

    <!-- Panel de Ingreso de Datos -->
    <div class="panel">
        <div class="control-group">
            <label>Inicio</label>
            <input type="date" id="startDate" onchange="calcularMesActual()">
        </div>
        <div class="control-group">
            <label>Mes</label>
            <input type="text" id="monthInput" value="0" readonly title="El sistema avanza el mes automáticamente">
        </div>
        <div class="control-group">
            <label>Capital Actual (USD)</label>
            <input type="text" id="capitalInput" oninput="formatearNumeros(this)" placeholder="Ej: 26500">
        </div>
        <div class="control-group">
            <button class="btn" onclick="guardarRegistro()">Guardar & Avanzar</button>
        </div>
        <div id="statusMessage" class="status-box">Inicializando sistema...</div>
    </div>

    <!-- Gráfico -->
    <div class="chart-container">
        <canvas id="portfolioChart"></canvas>
    </div>

    <!-- Panel Inferior: Sistema -->
    <div class="panel" style="justify-content: center; gap: 15px; padding: 15px; max-width: 800px;">
        <button class="btn btn-outline" onclick="exportarBackup()">📥 Exportar JSON</button>
        <div class="file-input-wrapper">
            <button class="btn btn-outline">📤 Importar</button>
            <input type="file" id="importFile" accept=".json" onchange="importarBackup(event)">
        </div>
        <button class="btn btn-outline btn-danger" onclick="borrarUltimo()">⎌ Deshacer Último Mes</button>
    </div>

    <script>
        // ==========================================
        // GENERADOR DE ICONO / LOGO EN CANVAS
        // ==========================================
        function generarIconoYFavicon() {
            const canvas = document.getElementById('appLogo');
            const ctx = canvas.getContext('2d');
            const size = 1024;
            const cx = size / 2;
            const cy = size / 2 + 120;

            // 1. Fondo Oscuro
            const bgGradient = ctx.createRadialGradient(cx, cy - 100, 100, cx, cy, size);
            bgGradient.addColorStop(0, '#1a1a24');
            bgGradient.addColorStop(1, '#050505');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, size, size);

            // 2. Cuadrícula
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 2;
            for(let i = 0; i < size; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
            }

            // 3. Gráfica de Tendencia Alcista
            ctx.beginPath();
            ctx.moveTo(cx - 300, cy - 50);
            ctx.lineTo(cx - 150, cy - 200);
            ctx.lineTo(cx - 20, cy - 120);
            ctx.lineTo(cx + 250, cy - 400);
            
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 24;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 30;
            ctx.stroke();

            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.moveTo(cx + 250, cy - 400);
            ctx.lineTo(cx + 180, cy - 400);
            ctx.lineTo(cx + 250, cy - 330);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 4. Medidor (Arco)
            const radius = 380;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 0);
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 60;
            ctx.lineCap = 'round';
            ctx.stroke();

            const arcGradient = ctx.createLinearGradient(cx - radius, cy, cx + radius, cy);
            arcGradient.addColorStop(0, '#ef4444');
            arcGradient.addColorStop(0.5, '#f59e0b');
            arcGradient.addColorStop(1, '#10b981');

            ctx.beginPath();
            const endAngle = Math.PI + (Math.PI * 0.85); 
            ctx.arc(cx, cy, radius, Math.PI, endAngle);
            ctx.strokeStyle = arcGradient;
            ctx.lineWidth = 60;
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 40;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 5. Aguja del Medidor
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(endAngle); 

            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;

            ctx.fillStyle = '#f3f4f6';
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(0, - radius + 40); 
            ctx.lineTo(20, 0);
            ctx.arc(0, 0, 45, 0, Math.PI, false);
            ctx.fill();

            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Configurar el Favicon de la pestaña extraído del canvas
            const link = document.createElement('link');
            link.rel = 'icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        }

        // ==========================================
        // LÓGICA DE LA APLICACIÓN
        // ==========================================
        const tasaDiariaObjetivo = 0.0005;   
        const tasaDiariaHistorica = 0.0004313; 
        const ruedasPorMes = 21; 
        const mesesTotales = 60; 
        
        const factorMensualObjetivo = Math.pow(1 + tasaDiariaObjetivo, ruedasPorMes);
        const factorMensualHistorico = Math.pow(1 + tasaDiariaHistorica, ruedasPorMes);
        
        const mesesNombres = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        let db = {
            startDate: new Date().toISOString().split('T')[0],
            capitalInicial: 0,
            registros: {}
        };

        let chart;
        let alertaMostradaEnSesion = false;

        function parsearMoneda(str) {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, ''), 10) || 0;
        }

        function formatearMoneda(num) {
            return new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(Math.round(num));
        }

        function formatearNumeros(input) {
            let val = parsearMoneda(input.value);
            if (val === 0 && input.value !== "0") input.value = "";
            else input.value = formatearMoneda(val);
        }

        function mostrarAlerta(valorAbsoluto, esPositiva) {
            const modal = document.getElementById('megaAlert');
            const box = document.getElementById('megaAlertBox');
            const title = document.getElementById('megaAlertTitle');
            const desc = document.getElementById('megaAlertDesc');

            if (esPositiva) {
                box.className = "mega-alert-box positive";
                title.innerText = "🚀 ¡Rendimiento Extraordinario! 🚀";
                desc.innerHTML = `Tu portafolio está superando las expectativas. Actualmente se encuentra un <br><strong>+${valorAbsoluto.toFixed(2)}%</strong><br> por encima del promedio histórico esperado (11.50% anual).`;
            } else {
                box.className = "mega-alert-box negative";
                title.innerText = "⚠️ Alerta de Desviación ⚠️";
                desc.innerHTML = `El capital ha registrado una corrección significativa. Actualmente se encuentra un <br><strong>-${valorAbsoluto.toFixed(2)}%</strong><br> por debajo de la proyección histórica del 11.50% anual.`;
            }
            modal.style.display = 'flex';
        }

        function cerrarAlerta() {
            document.getElementById('megaAlert').style.display = 'none';
        }

        function initApp() {
            generarIconoYFavicon(); // Renderiza el logo y setea el favicon

            const guardado = localStorage.getItem('portfolioOS_mensual_usd_v1');
            if (guardado) db = JSON.parse(guardado);
            else guardarEnStorage();

            document.getElementById('startDate').value = db.startDate;
            calcularMesActual();
            initChart();
        }

        function guardarEnStorage() {
            localStorage.setItem('portfolioOS_mensual_usd_v1', JSON.stringify(db));
        }

        function calcularMesActual() {
            const inicio = document.getElementById('startDate').value;
            if (inicio) {
                db.startDate = inicio;
                guardarEnStorage();
            }

            let claves = Object.keys(db.registros).map(Number);
            let ultimoMes = claves.length > 0 ? Math.max(...claves) : -1;
            let mesAEditar = ultimoMes + 1;
            
            document.getElementById('monthInput').value = mesAEditar;
            document.getElementById('capitalInput').value = "";
            
            if (chart) actualizarGrafico();
        }

        function guardarRegistro() {
            let mes = parsearMoneda(document.getElementById('monthInput').value);
            let val = parsearMoneda(document.getElementById('capitalInput').value);
            
            if (val === 0) return alert("Por favor ingresá un capital válido en USD.");

            if (mes === 0) db.capitalInicial = val;
            db.registros[mes] = val;
            guardarEnStorage();
            
            alertaMostradaEnSesion = false; 
            actualizarGrafico();

            document.getElementById('monthInput').value = mes + 1;
            document.getElementById('capitalInput').value = "";
            document.getElementById('capitalInput').focus();
        }

        function borrarUltimo() {
            let claves = Object.keys(db.registros).map(Number);
            if (claves.length === 0) {
                alert("No hay registros para borrar.");
                return;
            }
            
            let maxMes = Math.max(...claves);

            if(confirm(`¿Deshacer el registro del Mes ${maxMes}?`)) {
                delete db.registros[maxMes];
                if (maxMes === 0) db.capitalInicial = 0; 
                guardarEnStorage();
                
                document.getElementById('monthInput').value = maxMes;
                document.getElementById('capitalInput').value = "";
                alertaMostradaEnSesion = false;
                actualizarGrafico();
            }
        }

        function generarEtiquetasMeses(fechaInicioString) {
            const partesFecha = fechaInicioString.split('-'); 
            let añoInicio = parseInt(partesFecha[0]);
            let mesInicio = parseInt(partesFecha[1]) - 1; 
            
            let etiquetas = [];
            for (let i = 0; i <= mesesTotales; i++) {
                let mesActual = (mesInicio + i) % 12;
                let añoActual = añoInicio + Math.floor((mesInicio + i) / 12);
                let añoCorto = añoActual.toString().slice(-2);
                
                if (i === 0 || mesActual === 0) {
                    etiquetas.push(`${mesesNombres[mesActual]} '${añoCorto}`);
                } else {
                    etiquetas.push(mesesNombres[mesActual]);
                }
            }
            return etiquetas;
        }

        function initChart() {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#8b8d91', font: { size: 13, family: "monospace" }, usePointStyle: true, padding: 20 } },
                        tooltip: {
                            backgroundColor: '#111', titleColor: '#fff', titleFont: {family: 'monospace'}, bodyColor: '#f3f4f6', bodyFont: {family: 'monospace'},
                            borderColor: '#333', borderWidth: 1, padding: 12,
                            callbacks: { label: function(c) { return c.dataset.label.split(' ')[0] + ': U$D ' + formatearMoneda(c.raw); } }
                        }
                    },
                    scales: {
                        x: { 
                            grid: { color: '#222' }, 
                            ticks: { 
                                color: '#8b8d91', font: {family: 'monospace', size: 11},
                                maxRotation: 45, minRotation: 45, autoSkip: false
                            } 
                        },
                        y: { grid: { color: '#222' }, ticks: { color: '#8b8d91', font: {family: 'monospace'}, callback: function(v) { return 'U$D ' + formatearMoneda(v); } } }
                    }
                }
            });
            actualizarGrafico();
        }

        function actualizarGrafico() {
            const etiquetas = generarEtiquetasMeses(db.startDate);
            
            const datosObjetivo = [];
            const datosHistorico = [];
            const datosReales = [];
            
            let ultimoMesRegistrado = Object.keys(db.registros).length > 0 ? Math.max(...Object.keys(db.registros).map(Number)) : -1;
            let capInicial = db.capitalInicial || 0;

            for (let i = 0; i <= mesesTotales; i++) {
                if (capInicial > 0) {
                    let valorObj = capInicial * Math.pow(factorMensualObjetivo, i);
                    let valorHist = capInicial * Math.pow(factorMensualHistorico, i);
                    datosObjetivo.push(Math.round(valorObj));
                    datosHistorico.push(Math.round(valorHist));
                } else {
                    datosObjetivo.push(null);
                    datosHistorico.push(null);
                }
                
                if (i <= ultimoMesRegistrado && db.registros[i] !== undefined) {
                    datosReales.push(db.registros[i]);
                } else if (i <= ultimoMesRegistrado) {
                    datosReales.push(null); 
                }
            }

            chart.data.labels = etiquetas;
            chart.data.datasets = [
                {
                    label: 'Actual (Capital)',
                    data: datosReales,
                    borderColor: '#06b6d4', 
                    backgroundColor: chart.ctx.createLinearGradient(0,0,0,400),
                    borderWidth: 2,
                    pointBackgroundColor: '#050505',
                    pointBorderColor: '#06b6d4',
                    pointRadius: 3,
                    pointHoverRadius: 6,
                    fill: true,
                    spanGaps: true,
                    tension: 0.1
                },
                {
                    label: 'Objetivo (+0.05% diario)',
                    data: datosObjetivo,
                    borderColor: '#10b981',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false,
                    tension: 0.3
                },
                {
                    label: 'Histórico (~11.50% anual)',
                    data: datosHistorico,
                    borderColor: '#8b5cf6',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false,
                    tension: 0.3
                }
            ];
            
            let grad = chart.ctx.createLinearGradient(0, 0, 0, 400);
            grad.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
            grad.addColorStop(1, 'rgba(6, 182, 212, 0.0)');
            chart.data.datasets[0].backgroundColor = grad;

            chart.update();
            actualizarEstado(ultimoMesRegistrado, capInicial);
        }

        function actualizarEstado(ultimoMes, capInicial) {
            const statusBox = document.getElementById('statusMessage');
            
            if (capInicial === 0) {
                statusBox.innerHTML = "Esperando el capital inicial (Mes 0) en USD para comenzar la proyección.";
                statusBox.className = "status-box";
                return;
            }
            if (ultimoMes === 0) {
                statusBox.innerHTML = "Inicializado en dólares. Guardá los datos del próximo mes para medir progreso.";
                statusBox.className = "status-box";
                return;
            }

            let valorReal = db.registros[ultimoMes];
            let valorEsperadoHistorico = Math.round(capInicial * Math.pow(factorMensualHistorico, ultimoMes));
            
            let diferencia = valorReal - valorEsperadoHistorico;
            let difPorcentaje = (diferencia / valorEsperadoHistorico) * 100;

            if (diferencia >= 0) {
                statusBox.innerHTML = `🟢 SISTEMA ESTABLE: +U$D ${formatearMoneda(Math.abs(diferencia))} (+${difPorcentaje.toFixed(2)}%) vs. Histórico.`;
                statusBox.className = "status-box status-good";
                
                if (difPorcentaje >= 10 && !alertaMostradaEnSesion) {
                    mostrarAlerta(Math.abs(difPorcentaje), true);
                    alertaMostradaEnSesion = true;
                }
            } else {
                statusBox.innerHTML = `🔴 DIVERGENCIA NEGATIVA: -U$D ${formatearMoneda(Math.abs(diferencia))} (${Math.abs(difPorcentaje).toFixed(2)}%) vs. Histórico.`;
                statusBox.className = "status-box status-bad";

                if (difPorcentaje <= -10 && !alertaMostradaEnSesion) {
                    mostrarAlerta(Math.abs(difPorcentaje), false);
                    alertaMostradaEnSesion = true;
                }
            }
        }

        function exportarBackup() {
            const datosStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dl = document.createElement('a');
            dl.setAttribute("href", datosStr);
            dl.setAttribute("download", `Portafolio_USD_Backup_${new Date().toISOString().split('T')[0]}.json`);
            dl.click();
        }

        function importarBackup(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    if(datos.capitalInicial !== undefined && datos.registros) {
                        db = datos;
                        guardarEnStorage();
                        document.getElementById('startDate').value = db.startDate;
                        calcularMesActual();
                        alert("Datos en USD restaurados correctamente.");
                    } else alert("JSON inválido.");
                } catch (error) { alert("Error de lectura."); }
            };
            lector.readAsText(archivo);
        }

        window.onload = initApp;
    </script>
</body>
</html>
